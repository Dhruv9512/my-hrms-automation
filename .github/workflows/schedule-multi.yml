name: M1. Schedule checkout (multi-user)
on:
  workflow_dispatch:
    inputs:
      user:
        description: 'Only this user ID (leave empty for all enabled users)'
        required: false
        default: ''
  # Daily trigger: a cron-job.org job (e.g. "hrms-multi-trigger") dispatching this
  # workflow with ref=multi-user at 16:30 IST, Mon-Fri. Not created yet.

jobs:
  schedule:
    if: vars.MULTI_CHECKOUT_ENABLED != 'false'   # repo variable 'false' pauses everyone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python hrms_multi.py schedule "${{ inputs.user }}"
        env:
          TARGET_MINUTES: '480'
          DRY_RUN: ${{ vars.MULTI_DRY_RUN != 'false' }}       # default: dry run
          LOG_DETAILS: ${{ vars.MULTI_LOG_DETAILS == 'true' }} # default: no personal data in logs
          HRMS_USERS: ${{ secrets.HRMS_USERS }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
