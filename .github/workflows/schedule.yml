name: 1. Schedule checkout
on:
  # schedule:
    # TEST mode: triggered every 2 min (Mon-Fri) by the cron-job.org job "hrms-5min-trigger".
    # For normal use: delete that job and uncomment the two lines below.
    # - cron: '0 11 * * 1-5'   # 16:30 IST, Mon-Fri
    # - cron: '0 13 * * 1-5'   # 18:30 IST, catches late check-ins
  workflow_dispatch:

jobs:
  schedule:
    if: vars.AUTO_CHECKOUT_ENABLED != 'false'   # set repo variable to 'false' to pause
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python hrms.py schedule
        env:
          TARGET_MINUTES: '445'  # TEST: 7h25m. Normal: '480' (8h)
          HRMS_EMAIL: ${{ secrets.HRMS_EMAIL }}
          HRMS_PASSWORD: ${{ secrets.HRMS_PASSWORD }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
