name: 1. Schedule checkout
on:
  # schedule:
    # Triggered at 16:30 and 18:30 IST, Mon-Fri, by the cron-job.org job "hrms-daily-trigger"
    # (more reliable than GitHub's own schedule). That run sets a one-time checkout alarm.
  workflow_dispatch:

jobs:
  schedule:
    if: vars.AUTO_CHECKOUT_ENABLED != 'false'   # set repo variable to 'false' to pause
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python hrms.py schedule
        env:
          TARGET_MINUTES: '480'  # 8 hours
          HRMS_EMAIL: ${{ secrets.HRMS_EMAIL }}
          HRMS_PASSWORD: ${{ secrets.HRMS_PASSWORD }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
